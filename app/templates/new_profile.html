{% extends "base.html" %}
{% block content %}
<section class="page-head">
    <div>
        <h1>Create Profile</h1>
        <p>New records follow: app - name - location - age</p>
    </div>
</section>

<form method="post" action="/profiles" class="card form-grid">
    <label>App<input type="text" name="app_name" placeholder="OKC" required></label>
    <label>Name<input type="text" name="name" placeholder="Annie" required></label>
    <label>Location<input type="text" name="location" placeholder="NBO West" required></label>
    <label>Distance<input type="text" name="distance" placeholder="4 km"></label>
    <label>Age<input type="text" name="age" placeholder="23 or ??"></label>
    <label>Phone / WhatsApp<input type="text" name="phone"></label>
    <label>Status
        <select name="status">
            {% for option in status_options %}
            <option value="{{ option }}">{{ option }}</option>
            {% endfor %}
        </select>
    </label>
    <div class="full">
        <div class="section-label">Tags</div>
        <div class="checkbox-grid">
            {% for tag in tag_options %}
            <label class="checkbox-row"><input type="checkbox" name="selected_tags" value="{{ tag }}"> {{ tag }}</label>
            {% endfor %}
        </div>
    </div>
    <label class="full">Private Notes<textarea name="notes" rows="5" placeholder="Private notes only"></textarea></label>
    <button type="submit">Save Profile</button>
</form>
{% endblock %}
